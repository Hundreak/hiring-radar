app:
  env: development
  log_level: INFO

http:
  timeout_seconds: 20
  user_agent: "HiringRadar/0.1"

storage:
  db_path: data/hiring_radar.db
  export_dir: data/exports

crawl:
  retry_count: 2

# Keyword filtering
keyword_filter:
  include_keywords:
    - engineer
  exclude_keywords:
    - intern
  match_title: true
  match_location: false
  match_company_name: false

notifications:
  apply_keyword_filter_to_digest: true