[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiring-radar"
version = "0.1.0"
description = "AI-assisted job matching platform with crawling, CV parsing, matching, candidate and employer workspaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pypdf>=5.0,<6.0",
  "python-docx>=1.1,<2.0",
  "Pillow>=10.0,<12.0",
  "pytesseract>=0.3.10,<1.0",
  "itsdangerous>=2.2,<3.0",
  "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
hiring-radar = "hiring_radar.cli:app"
hiring-radar-api = "hiring_radar.api.serve:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Satır uzunluğu formatlayıcının işidir (`make format`); linter doğruluk
# kurallarını korur. Kapının anlamı, geçmek için gevşetilmiş olmasında değil,
# gerçekten hata yakalıyor olmasında.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI'nin bağımlılık enjeksiyonu argüman varsayılanında çağrı yapar;
# B008 bu deyim için yanlış pozitiftir.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Bu dosyalar yardımcı fonksiyonlarını kendi bölümlerinin yanında tutuyor ve
# import'ları oraya alıyor; yerleşim bilinçli, dosya başına taşımak bağlamı
# dağıtırdı.
"scripts/release_migration_dry_run.py" = ["E402"]
"src/hiring_radar/api/routers/user_profile.py" = ["E402"]
"src/hiring_radar/api/routers/user_security.py" = ["E402"]
"src/hiring_radar/services/cv_engine/batch/admin_runtime.py" = ["E402"]
