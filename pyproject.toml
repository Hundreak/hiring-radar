[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiring-radar"
version = "0.1.0"
description = "CLI-based system for tracking company career pages and detecting new job postings."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "PyYAML>=6.0,<7.0",
  "typer>=0.12,<1.0",
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.5,<1.0",
]

[project.scripts]
hiring-radar = "hiring_radar.cli:app"
hiring-radar-api = "hiring_radar.api.serve:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/hiring_radar/api/routers/admin_shell.py" = ["E501"]